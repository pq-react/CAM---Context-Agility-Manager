# Telegraf config for the CAM host (snapshot of /opt/cam/telegraf.conf,
# captured 2026-11-10). The token and endpoints are injected from the
# container environment — see docker-compose.yml / .env.example.
[agent]
  interval = "1s"
  flush_interval = "5s"
  hostname = "${TELEGRAF_HOSTNAME}"
  omit_hostname = false

[[outputs.influxdb_v2]]
  urls         = ["${INFLUX_URL}"]
  token        = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket       = "${INFLUX_BUCKET}"

[[inputs.cpu]]
  percpu     = true
  totalcpu   = true
  collect_cpu_time = false
  report_active = false

[[inputs.mem]]
[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "overlay", "aufs", "squashfs"]
[[inputs.diskio]]
[[inputs.kernel]]
[[inputs.processes]]
[[inputs.system]]
[[inputs.net]]

# NOTE: the cam_demo_panel dashboards also plot `temp`, `cpufreq` and a
# custom `powerstat` measurement. The deployed testbed config did NOT
# collect those (only the inputs above), so those panels stayed empty
# there. Add e.g. [[inputs.temp]] and an [[inputs.execd]] power reader
# if you need them.
